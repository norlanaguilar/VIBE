workflows:
  ios-release-workflow:
    name: Flutter iOS Release Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Build Flutter iOS Release App
        script: |
          xcodebuild -workspace ios/Runner.xcworkspace \
                     -scheme Runner \
                     -configuration Release \
                     -sdk iphoneos \
                     -derivedDataPath build/ios \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGN_BUILD_SETTINGS=NO \
                     CODE_SIGN_IDENTITY=""
      - name: Package Runner.app into Vibe.ipa
        script: |
          mkdir -p build/ios/iphoneos
          cp -R build/ios/Build/Products/Release-iphoneos/Runner.app build/ios/iphoneos/
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -R Runner.app Payload/
          zip -r Vibe.ipa Payload
          cp Vibe.ipa $CM_BUILD_DIR/
    artifacts:
      - Vibe.ipa
      - build/ios/Build/Products/Release-iphoneos/*.app
