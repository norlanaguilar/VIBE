workflows:
  ios-release-workflow:
    name: Flutter iOS Release Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Build Flutter iOS Release App
        script: |
          flutter build ios --release --no-codesign
      - name: Package Runner.app into Vibe.ipa
        script: |
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -r Vibe.ipa Payload
          cp Vibe.ipa ../../..
    artifacts:
      - Vibe.ipa
      - build/ios/iphoneos/*.app
      - /tmp/xcodebuild_logs/*.log
